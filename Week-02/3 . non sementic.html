<!DOCTYPE html>
<html lang="en">
<head>
    <title>Non-Semantic HTML</title>
</head>

<body>

    <!-- DIV: Block-level container -->
    <div>
        <h1>My Website</h1>
        <p>Welcome to my website.</p>
    </div>

    <!-- SPAN: Inline container -->
    <p>
        My favorite programming language is
        <span>Python</span>.
    </p>

</body>
</html>

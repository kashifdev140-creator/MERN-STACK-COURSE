<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>Responsive Tailwind Box</title>
</head>

<body class="bg-gray-100 p-5">

    <!-- Responsive Container -->
    <div class="max-w-6xl mx-auto">

        <!-- Responsive Boxes -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            <!-- Box 1 -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h2 class="text-2xl font-bold text-blue-600 mb-3">
                    Box 1
                </h2>

                <p class="text-gray-600">
                    This is the first responsive box.
                </p>

                <button class="mt-4 bg-blue-600 text-white px-5 py-2 rounded-lg
                               hover:bg-blue-700">
                    Read More
                </button>
            </div>

            <!-- Box 2 -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h2 class="text-2xl font-bold text-green-600 mb-3">
                    Box 2
                </h2>

                <p class="text-gray-600">
                    This is the second responsive box.
                </p>

                <button class="mt-4 bg-green-600 text-white px-5 py-2 rounded-lg
                               hover:bg-green-700">
                    Read More
                </button>
            </div>

            <!-- Box 3 -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h2 class="text-2xl font-bold text-purple-600 mb-3">
                    Box 3
                </h2>

                <p class="text-gray-600">
                    This is the third responsive box.
                </p>

                <button class="mt-4 bg-purple-600 text-white px-5 py-2 rounded-lg
                               hover:bg-purple-700">
                    Read More
                </button>
            </div>

        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Tailwind Website</title>
</head>

<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-gray-900 text-white">

        <!-- Navigation -->
        <nav class="max-w-7xl mx-auto flex justify-between items-center p-5">

            <!-- Logo -->
            <div class="text-2xl font-bold text-blue-400">
                MyLogo
            </div>

            <!-- Navigation Links -->
            <div class="flex gap-8">
                <a href="#" class="hover:text-blue-400">Home</a>
                <a href="#" class="hover:text-blue-400">About</a>
                <a href="#" class="hover:text-blue-400">Services</a>
                <a href="#" class="hover:text-blue-400">Contact</a>
            </div>

        </nav>
    </header>


    <!-- Main -->
    <main>

        <!-- Section -->
        <section class="min-h-screen flex flex-col justify-center items-center text-center px-5">

            <h1 class="text-5xl font-bold text-gray-800 mb-5">
                Welcome to My Website
            </h1>

            <p class="text-lg text-gray-600 max-w-2xl mb-7">
                This is a simple website created using HTML and Tailwind CSS.
            </p>

            <button class="bg-blue-600 text-white px-6 py-3 rounded-lg 
                           hover:bg-blue-700">
                Get Started
            </button>

        </section>

    </main>


    <!-- Footer -->
    <footer class="bg-gray-900 text-white text-center p-5">

        <p>
            © 2026 My Website. All Rights Reserved.
        </p>

    </footer>

</body>
</html>
